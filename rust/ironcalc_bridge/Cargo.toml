[package]
name = "tigersheets_calc_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ironcalc_base = { path = "../../third_party/ironcalc/base" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "unwind"

